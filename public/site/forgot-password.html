<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="api-base" content="" />
<title>Forgot Password - Tiketa</title>
<link rel="canonical" href="/forgot-password" />
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<main class="auth-split">
  <div class="visual">
    <div class="position-relative" style="z-index:2;max-width:460px">
      <a href="/welcome" class="brand text-white" style="color:#fff !important"><span class="brand-logo"><i class="bi bi-ticket-perforated-fill"></i></span>Tiketa</a>
      <h1 class="mt-5 text-white" style="color:#fff !important" data-i18n="auth.reset_visual_title">Get back to your tickets.</h1>
      <p class="mt-3" style="color:rgba(255,255,255,.85)" data-i18n="auth.reset_visual_copy">Reset your password securely and continue managing your Tiketa account.</p>
    </div>
  </div>

  <div class="form-side">
    <div class="auth-form fade-up in">
      <h2 data-i18n="auth.forgot_password_title">Forgot password?</h2>
      <p class="text-muted-pro" data-i18n="auth.forgot_password_copy">Enter your account email and we will send a password reset link.</p>

      <div class="alert alert-success mt-4 d-none" role="status" data-reset-success data-i18n="auth.reset_link_sent">
        Password reset link has been sent to your email.
      </div>

      <form data-forgot-password-form class="mt-4">
        <label class="form-label" data-i18n="auth.email_address">Email Address</label>
        <input class="form-control" type="email" name="email" required placeholder="you@email.com" autocomplete="email"/>
        <button type="submit" class="btn btn-primary-grad w-100 mt-4 btn-lg" data-i18n="auth.send_reset_link">Send reset link</button>
      </form>

      <p class="text-muted-pro text-center mt-4 small"><a href="/login" data-i18n="buttons.back_to_login">Back to Login</a></p>
    </div>
  </div>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/runtime-config.js"></script>
<script defer src="../assets/js/api/config.js"></script>
<script defer src="../assets/js/api/api-client.js"></script>
<script defer src="../assets/js/api/auth.js"></script>
<script defer src="../assets/js/i18n/dictionaries.js"></script>
<script defer src="../assets/js/i18n/language-service.js"></script>
<script defer src="../assets/js/main.js"></script>
<script defer src="../assets/js/pages/forgot-password-page.js"></script>
</body>
</html>
