<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="api-base" content="" />
<title>Scanner Dashboard - Tiketa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="dash-shell">
  <aside class="dash-side">
    <a class="brand mb-4" href="scanner-dashboard.html"><span class="brand-logo"><i class="bi bi-qr-code-scan"></i></span>Scanner</a>
    <nav class="menu">
      <a class="active" href="scanner-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="check-in.html"><i class="bi bi-qr-code-scan"></i> QR Scanner</a>
      <a href="#" data-logout><i class="bi bi-box-arrow-right"></i> Sign out</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <button class="btn btn-glass d-lg-none" data-toggle-side><i class="bi bi-list"></i></button>
        <h1 class="d-inline-block mb-0" style="font-size:1.8rem">Scanner Dashboard</h1>
        <p class="mb-0 text-muted-pro">Assigned event ticket scanning.</p>
      </div>
      <button class="icon-btn" data-theme-toggle title="Toggle theme"><i class="bi bi-sun" data-theme-icon></i></button>
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card-pro p-3 h-100">
          <div class="row g-3 align-items-center" data-scanner-assigned-event>
            <div class="col-12">
              <div class="dashboard-empty">
                <span class="spinner-border spinner-border-sm"></span>
                <span>Loading assigned event...</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card-pro p-3 h-100">
          <div class="kpi mb-3">
            <div class="label">Total Scanned Today</div>
            <div class="value" data-scanner-total-today>0</div>
          </div>
          <a class="btn btn-primary-grad w-100" href="check-in.html" data-scanner-scan-link>
            <i class="bi bi-qr-code-scan me-1"></i>Scan QR
          </a>
        </div>
      </div>

      <div class="col-12">
        <div class="card-pro p-3">
          <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3">
            <h4 class="m-0">Recent scans</h4>
          </div>
          <div class="table-responsive">
            <table class="table table-borderless align-middle mb-0 dashboard-table">
              <thead><tr><th>Result</th><th>Attendee</th><th>Event</th><th>Ticket</th><th>Time</th></tr></thead>
              <tbody data-scanner-recent-scans>
                <tr><td colspan="5" class="text-muted-pro">Loading recent scans...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api/config.js"></script>
<script src="../assets/js/api/api-client.js"></script>
<script src="../assets/js/api/auth.js"></script>
<script src="../assets/js/api/utils.js"></script>
<script src="../assets/js/i18n/dictionaries.js"></script>
<script src="../assets/js/i18n/language-service.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/pages/scanner-dashboard-page.js"></script>
</body>
</html>
