<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="api-base" content="" />
<title>Scanner Dashboard - Tiketa</title>
<link rel="canonical" href="/scanner-dashboard" />
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="dashboard-enterprise scanner-dashboard-page">
<div class="dash-shell">
  <aside class="dash-side">
    <a class="brand mb-4" href="/scanner-dashboard"><span class="brand-logo"><i class="bi bi-qr-code-scan"></i></span><span data-i18n="scanner.scanner">Scanner</span></a>
    <nav class="menu">
      <a class="active" href="/scanner-dashboard"><i class="bi bi-speedometer2"></i> <span data-i18n="header.dashboard">Dashboard</span></a>
      <a href="/check-in"><i class="bi bi-qr-code-scan"></i> <span data-i18n="scanner.qr_scanner">QR Scanner</span></a>
      <a href="#" data-logout><i class="bi bi-box-arrow-right"></i> <span data-i18n="header.sign_out">Sign out</span></a>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <button class="btn btn-glass d-lg-none" data-toggle-side><i class="bi bi-list"></i></button>
        <h1 class="d-inline-block mb-0" style="font-size:1.8rem" data-i18n="scanner.dashboard">Scanner Dashboard</h1>
        <p class="mb-0 text-muted-pro" data-i18n="scanner.dashboard_copy">Assigned event ticket scanning.</p>
      </div>
      <button class="icon-btn" data-theme-toggle title="Toggle theme"><i class="bi bi-sun" data-theme-icon></i></button>
    </div>

    <div class="row g-3">
      <div class="col-lg-8">
        <div class="card-pro p-3 h-100">
          <div class="row g-3 align-items-center" data-scanner-assigned-event>
            <div class="col-12">
              <div class="dashboard-loading-skeleton" role="status" aria-label="Loading assigned event">
                <span class="skeleton-line" style="width:72%"></span>
                <span class="skeleton-line" style="width:48%"></span>
                <span class="skeleton-line" style="width:86%"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card-pro p-3 h-100">
          <div class="kpi mb-3">
            <div class="label" data-i18n="scanner.total_scanned_today">Total Scanned Today</div>
            <div class="value" data-scanner-total-today>0</div>
          </div>
          <a class="btn btn-primary-grad w-100" href="/check-in" data-scanner-scan-link>
            <i class="bi bi-qr-code-scan me-1"></i><span data-i18n="scanner.scan_qr">Scan QR</span>
          </a>
        </div>
      </div>

      <div class="col-12">
        <div class="card-pro p-3">
          <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3">
            <h4 class="m-0" data-i18n="scanner.recent_scans">Recent scans</h4>
          </div>
          <div class="table-responsive">
            <table class="table table-borderless align-middle mb-0 dashboard-table">
              <thead><tr><th data-i18n="admin.result">Result</th><th data-i18n="scanner.attendee">Attendee</th><th data-i18n="scanner.event">Event</th><th data-i18n="scanner.ticket">Ticket</th><th data-i18n="admin.time">Time</th></tr></thead>
              <tbody data-scanner-recent-scans>
                <tr class="skeleton-row"><td></td><td></td><td></td><td></td><td></td></tr>
                <tr class="skeleton-row"><td></td><td></td><td></td><td></td><td></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/runtime-config.js"></script>
<script defer src="../assets/js/api/config.js"></script>
<script defer src="../assets/js/api/api-client.js"></script>
<script defer src="../assets/js/api/auth.js"></script>
<script defer src="../assets/js/api/utils.js"></script>
<script defer src="../assets/js/i18n/dictionaries.js"></script>
<script defer src="../assets/js/i18n/language-service.js"></script>
<script defer src="../assets/js/main.js"></script>
<script defer src="../assets/js/pages/scanner-dashboard-page.js"></script>
</body>
</html>
