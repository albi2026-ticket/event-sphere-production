<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="api-base" content="" />
<title>Create account — Tiketa</title>
<link rel="canonical" href="/register" />
<meta name="robots" content="noindex,nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-split">
  <div class="visual">
    <div style="z-index:2;position:relative;max-width:460px">
      <a href="/welcome" class="brand" style="color:#fff !important"><span class="brand-logo"><i class="bi bi-ticket-perforated-fill"></i></span>Tiketa</a>
      <h1 class="mt-5" style="color:#fff !important" data-i18n="auth.register_visual_title">Curated access to events, dining, and nights out.</h1>
      <p class="mt-3" style="color:rgba(255,255,255,.85)" data-i18n="auth.register_visual_copy">Book tickets, reserve restaurants and bars, and receive trusted confirmations from one refined platform.</p>
    </div>
  </div>
  <div class="form-side">
    <div class="auth-form fade-up in">
      <h2 data-i18n="auth.create_account_title">Create your account</h2>
      <p class="text-muted-pro" data-i18n="auth.create_account_copy">Join Tiketa to manage tickets, reservations, and event updates.</p>
      <div class="d-grid gap-2 mt-4">
        <button class="btn btn-ghost" type="button" data-social-auth="Google"><i class="bi bi-google me-2"></i> <span data-i18n="auth.sign_up_google">Sign up with Google</span></button>
        <button class="btn btn-ghost" type="button" data-social-auth="Apple"><i class="bi bi-apple me-2"></i> <span data-i18n="auth.sign_up_apple">Sign up with Apple</span></button>
      </div>
      <div class="d-flex align-items-center my-4 gap-2"><hr class="flex-grow-1 m-0" style="border-color:var(--border)"/><span class="text-muted-pro small" data-i18n="auth.or">or</span><hr class="flex-grow-1 m-0" style="border-color:var(--border)"/></div>
      <form data-register-form>
        <div class="row g-2">
          <div class="col-6"><label class="form-label" data-i18n="forms.first_name">First name</label><input class="form-control" name="first_name" required/></div>
          <div class="col-6"><label class="form-label" data-i18n="forms.last_name">Last name</label><input class="form-control" name="last_name" required/></div>
        </div>
        <label class="form-label mt-2" data-i18n="forms.email">Email</label><input class="form-control" type="email" name="email" required/>
        <label class="form-label mt-2" data-i18n="auth.password">Password</label><input class="form-control" type="password" name="password" required minlength="8" placeholder="At least 8 characters" data-i18n-attr="placeholder:auth.password_placeholder"/>
        <div class="form-check mt-3"><input class="form-check-input" type="checkbox" required><label class="form-check-label small"><span data-i18n="auth.terms_agree">I agree to the</span> <a href="#" data-policy-link="Terms" data-i18n="auth.terms">Terms</a> and <a href="#" data-policy-link="Privacy Policy" data-i18n="auth.privacy_policy">Privacy Policy</a></label></div>
        <button class="btn btn-primary-grad w-100 mt-4 btn-lg" data-i18n="buttons.create_account">Create account</button>
</form>
      <p class="text-muted-pro text-center mt-4 small"><span data-i18n="auth.already_member">Already a member?</span> <a href="/login" data-i18n="auth.sign_in_button">Sign in</a></p>
    </div>
  </div>
</div>
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/runtime-config.js"></script>
<script defer src="../assets/js/api/config.js"></script>
<script defer src="../assets/js/api/api-client.js"></script>
<script defer src="../assets/js/api/auth.js"></script>
<script defer src="../assets/js/i18n/dictionaries.js"></script>
<script defer src="../assets/js/i18n/language-service.js"></script>
<script defer src="../assets/js/main.js"></script>
<script defer src="../assets/js/pages/register-page.js"></script>
</body>
</html>
