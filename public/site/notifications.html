<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="api-base" content="" />
<title>Notifications | Tiketa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
<div data-partial="header"></div>
<script src="../assets/js/partials.js"></script>

<main class="content-page">
  <section class="content-hero">
    <div class="container-xxl">
      <div class="eyebrow" data-i18n="notifications.center">Notification Center</div>
      <h1 data-i18n="notifications.all">All notifications</h1>
      <p class="content-lead mt-3" data-i18n="notifications.center_copy">Reservation, ticket, organizer, venue, and platform updates for your account.</p>
    </div>
  </section>

  <section class="section-sm">
    <div class="container-xxl">
      <div class="card-pro p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3">
          <div>
            <h4 class="m-0" data-i18n="notifications.center">Notification Center</h4>
            <p class="text-muted-pro mb-0" data-i18n="notifications.most_recent_first">Most recent first.</p>
          </div>
          <button class="btn btn-glass" type="button" data-notifications-read-all><i class="bi bi-check2-all me-1"></i> <span data-i18n="notifications.mark_all_as_read">Mark all as read</span></button>
        </div>
        <div data-notifications-list>
          <div class="notification-skeleton-list" role="status" aria-label="Loading notifications">
            <div class="notification-item skeleton-notification"><span class="notification-icon skeleton-avatar"></span><span class="notification-copy"><span class="skeleton-line" style="width:42%"></span><span class="skeleton-line" style="width:86%"></span><span class="skeleton-line" style="width:24%"></span></span></div>
            <div class="notification-item skeleton-notification"><span class="notification-icon skeleton-avatar"></span><span class="notification-copy"><span class="skeleton-line" style="width:48%"></span><span class="skeleton-line" style="width:78%"></span><span class="skeleton-line" style="width:22%"></span></span></div>
            <div class="notification-item skeleton-notification"><span class="notification-icon skeleton-avatar"></span><span class="notification-copy"><span class="skeleton-line" style="width:38%"></span><span class="skeleton-line" style="width:82%"></span><span class="skeleton-line" style="width:26%"></span></span></div>
          </div>
        </div>
        <div class="mt-3" data-notifications-pagination></div>
      </div>
    </div>
  </section>
</main>

<div data-partial="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api/config.js"></script>
<script src="../assets/js/api/api-client.js"></script>
<script src="../assets/js/api/auth.js"></script>
<script src="../assets/js/i18n/dictionaries.js"></script>
<script src="../assets/js/i18n/language-service.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/pages/notifications-page.js"></script>
</body>
</html>
